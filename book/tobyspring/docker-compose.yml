services:
  mysql:
    image: mysql:8.4
    container_name: tobyspring-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: tobyspring
      MYSQL_USER: toby
      MYSQL_PASSWORD: toby
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
